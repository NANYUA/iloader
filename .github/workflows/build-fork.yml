name: "Build fork (fixed login)"

# Focused build for this fork: produces installable artifacts without requiring
# the upstream updater signing keys. Uses src-tauri/ci.conf.json, which empties
# the updater pubkey/endpoints and disables createUpdaterArtifacts, so the build
# does not need TAURI_SIGNING_PRIVATE_KEY.
#
# The upstream .github/workflows/build.yml still exists and covers the full
# 8-platform matrix on release; this one is the everyday "give me a binary" job.

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      build_linux:
        description: "Also build Linux"
        type: boolean
        default: false
      build_macos:
        description: "Also build macOS"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Windows always builds. It is the target this fork actually needs, and it is
  # the cheapest of the three runners.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache cargo and node modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            node_modules
          key: fork-windows-${{ hashFiles('**/Cargo.lock', 'bun.lock') }}
          restore-keys: |
            fork-windows-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Some native crates shell out to perl/make on Windows, and neither is
      # guaranteed to be on PATH on the runner.
      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress -y

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun i --frozen-lockfile

      - name: Clear stale bundles
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          # ci.conf.json removes the updater signing requirement.
          args: --config src-tauri/ci.conf.json

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Do NOT use "dist" here: Vite already writes the frontend bundle to
          # dist/, so reusing that name uploads index.html and the svgs too.
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \
            \( -name "*.exe" -o -name "*.msi" \) \
            -exec cp -v {} release-assets/ \;
          # The portable single-file build sits next to the bundle directory.
          if [ -f src-tauri/target/release/iloader.exe ]; then
            cp -v src-tauri/target/release/iloader.exe release-assets/
          fi
          ls -la release-assets

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iloader-fixed-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  # Separate jobs so the runners are only allocated when actually requested.
  # The previous single-matrix version still queued macOS/Linux and then
  # skipped every step inside them, which held a runner slot for nothing.
  linux:
    if: github.event_name == 'workflow_dispatch' && inputs.build_linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun i --frozen-lockfile

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles deb,appimage --config src-tauri/ci.conf.json

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \
            \( -name "*.deb" -o -name "*.AppImage" \) \
            -exec cp -v {} release-assets/ \;
          ls -la release-assets

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iloader-fixed-linux-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.build_macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun i --frozen-lockfile

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target universal-apple-darwin --config src-tauri/ci.conf.json

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f -name "*.dmg" \
            -exec cp -v {} release-assets/ \;
          ls -la release-assets

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iloader-fixed-macos-universal
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  # Publishes the Windows binaries as a Release so they can be downloaded
  # without digging through the Actions run page. Tag is build-<run number>,
  # marked prerelease because this fork is not the official project.
  release:
    needs: windows
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: iloader-fixed-windows-x64
          path: release-assets

      - name: List assets
        run: ls -la release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "iloader 修复版 build ${{ github.run_number }}"
          body: |
            自动构建的 iloader 修复版（登录问题）。

            提交：`${{ github.sha }}`

            **修改内容**：`src-tauri/src/account.rs` 改用当前的 `Mac OS X` 身份字符串，
            不再使用 macOS 10.12.6 的旧身份。

            **安装后必须先点一次 Settings → Reset Anisette State 再登录**，
            否则会在 2FA 之后报 `-22410`。

            详细说明见 [README](https://github.com/NANYUA/iloader#readme)。
          files: release-assets/*
          draft: false
          prerelease: true
